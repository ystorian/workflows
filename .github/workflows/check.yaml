# .github/workflows/check.yaml

# Reusable job to check a repository.
#
# Actions used:
# - [taiki-e/install-action](https://github.com/taiki-e/install-action)
# - [actions/checkout](https://github.com/actions/checkout)
#
# The caller repository must have these Just recipes:
# - `check_just`
# - `check_typos`
# - `check_actions`
# - `audit_actions`
#
# To reduce the total action time, the `test` jobs of the caller do not depend on this job.
#
# On failure, this job cancels the whole workflow run.
#
# Returns:
# - Failure when a check fails, and cancels the workflow run.
# - Failure when a commit has no sign-off by its author.

name: Check

on:
  workflow_call:
    inputs:
      tools:
        description: More tools to install, comma separated.
        type: string
        default: ''
      recipes:
        description: More Just recipes to run, space separated. Skips `check_rust`.
        type: string
        default: ''
      timeout:
        description: Job timeout in minutes.
        type: number
        default: 1

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04-arm
    permissions:
      actions: write # Required to cancel the `test` jobs on failure.
      contents: read
    timeout-minutes: ${{ inputs.timeout }}

    steps:

      - name: Install cargo tools
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: >-
            just,typos,zizmor${{ inputs.tools != '' && format(',{0}', inputs.tools) || '' }}

      - name: Install Pinact
        run: |
          set -euo pipefail
          version="5.0.2"
          release="https://github.com/suzuki-shunsuke/pinact/releases/download/v${version}"
          archive="pinact_linux_arm64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" "${release}/${archive}"
          curl -fsSL -o /tmp/pinact_checksums.txt "${release}/pinact_${version}_checksums.txt"
          (cd /tmp && grep " ${archive}\$" pinact_checksums.txt | sha256sum -c -)
          mkdir -p "/tmp/pinact_${version}"
          tar -xzf "/tmp/${archive}" -C "/tmp/pinact_${version}" pinact
          echo "/tmp/pinact_${version}" >> "$GITHUB_PATH"

      - name: Checkout the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Get the default branch for the sign-off check.
          fetch-depth: 0
          persist-credentials: false

      # A sign-off is a `Signed-off-by: Name <email>` line in the commit message.
      # It is the author's statement for the DCO (Developer Certificate of Origin).
      # This is checked here since we cannot use organization rulesets for this.
      - name: Check commit Signed-off-by
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "origin/${DEFAULT_BRANCH}..HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%B' "$sha" | grep -qxF "Signed-off-by: ${author}"; then
              echo "::error::Commit ${sha:0:7} has no sign-off by ${author}."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Add the sign-off with: git rebase --signoff origin/${DEFAULT_BRANCH}"
            exit 1
          fi
          echo "All commits have a sign-off."

      - name: Check Just recipes
        run: just check_just

      - name: Check Typos
        run: just check_typos

      - name: Check action versions with Pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just check_actions

      - name: Audit actions with Zizmor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just audit_actions

      - name: Run more Just recipes
        if: inputs.recipes != ''
        env:
          RECIPES: ${{ inputs.recipes }}
        run: |
          set -euo pipefail
          read -ra recipes <<< "$RECIPES"
          for recipe in "${recipes[@]}"; do
            if [ "$recipe" = check_rust ]; then
              echo "::warning::Skipping 'check_rust', this check is in 'test_rust.yaml'"
              continue
            fi
            just "$recipe"
          done

      - name: Cancel on failure
        # Cancel the `test` jobs on failure since they don't depend on `check`.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "${RUN_ID}" --repo "${REPO}"
