# .github/workflows/dispatch_to_ynfra.yaml

# Reusable job to send a `repository_dispatch` event to the Ynfra repository.
#
# The dispatch token is the `YNFRA_DISPATCH_TOKEN` environment secret.
#
# Returns:
# - Sends the `event` event to `<owner>/ynfra`.

name: Dispatch to Ynfra

on:
  workflow_call:
    inputs:
      event:
        description: Event type, for example `restart-ysto`.
        type: string
        required: true
      environment:
        description: Environment that holds the token.
        type: string
        default: production
    secrets:
      YNFRA_DISPATCH_TOKEN:
        description: Dispatch token, an environment secret.
        required: true

permissions: {}

jobs:
  dispatch:
    name: Dispatch to Ynfra
    runs-on: ubuntu-slim
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    timeout-minutes: 1

    steps:

      - name: Call Ynfra
        env:
          GH_TOKEN: ${{ secrets.YNFRA_DISPATCH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ inputs.event }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::YNFRA_DISPATCH_TOKEN is missing."
            exit 1
          fi
          gh api "/repos/${OWNER}/ynfra/dispatches" --field event_type="$EVENT"
